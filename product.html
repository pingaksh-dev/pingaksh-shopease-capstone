<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="View product details and add products to your ShopEase cart.">

    <meta name="author"
          content="Pingaksh Arora">

    <title>ShopEase | Product Details</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->

    <header class="site-header">

        <div class="container nav-container">

            <a href="index.html"
               class="logo"
               aria-label="ShopEase Home">
                ShopEase
            </a>

            <nav class="main-nav"
                 aria-label="Main navigation">

                <a href="index.html"
                   class="nav-link">
                    Home
                </a>

                <a href="products.html"
                   class="nav-link">
                    Products
                </a>

                <a href="cart.html"
                   class="nav-link cart-link">
                    Cart
                    <span id="cart-count"
                          class="cart-count">
                        0
                    </span>
                </a>

            </nav>

        </div>

    </header>


    <!-- Main -->

    <main>

        <section class="product-detail-section">

            <div class="container">

                <a href="products.html"
                   class="back-link">
                    ← Back to Products
                </a>


                <!-- Product Details -->

                <div id="product-detail"
                     class="product-detail">

                    <!-- Product content generated by JavaScript -->

                </div>


                <!-- Product Not Found -->

                <div id="product-not-found"
                     class="empty-state hidden">

                    <div class="empty-icon"
                         aria-hidden="true">
                        🔍
                    </div>

                    <h2>
                        Product Not Found
                    </h2>

                    <p>
                        The product you're looking for does not exist.
                    </p>

                    <a href="products.html"
                       class="button primary">
                        Browse Products
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer class="site-footer">

        <div class="container footer-content">

            <div>

                <a href="index.html"
                   class="logo">
                    ShopEase
                </a>

                <p>
                    A Web Development Capstone Project.
                </p>

            </div>


            <div class="footer-links">

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="cart.html">
                    Cart
                </a>

            </div>

        </div>


        <div class="container footer-bottom">

            <p>
                © 2026 ShopEase. Built by Pingaksh Arora.
            </p>

        </div>

    </footer>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
